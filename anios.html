<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Años — Zarzuteca INNAZ</title>
  <!--
    ÍNDICE CRONOLÓGICO — Zarzuteca INNAZ, 30 de agosto de 2026.

    Puerta de entrada al eje «Años». Se recorre por DÉCADAS y, dentro de cada
    década, por años.

    Decisión de César (30-8-2026): el análisis histórico —qué ocurría en la
    política y en las demás artes— se escribe POR DÉCADA, no por año. El
    catálogo publicado tiene hoy estrenos en 100 años distintos repartidos en
    16 décadas: cien ensayos documentados serían inabordables; dieciséis, no.
    La ficha de un año concreto lista sus estrenos y muestra el ensayo de su
    década.

    Las décadas salen de la constante DECADAS de zarzuteca-data.js, que el
    generador construye con las que tienen alguna obra publicada y enriquece
    con el texto de la pestaña «Decadas» del maestro. Los recuentos de
    estrenos se calculan aquí sobre OBRAS: no hay ninguna cifra escrita a mano.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant+SC:wght@300;500;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="zarzuteca-data.js?v=af536426"></script>
  <style>
    :root{--black:#0B0B0B;--teal:#2AABB8;--teal-dark:#1B8A96;--teal-light:#EBF7F8;--cream:#F8F4EE;--border:#E2DAD0;--text:#1A1A1A;--muted:#777;--white:#FFFFFF;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
    nav{position:fixed;top:0;width:100%;z-index:100;padding:1.1rem 3.5rem;display:flex;align-items:center;justify-content:space-between;background:rgba(248,244,238,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Cormorant SC',serif;font-size:1.65rem;font-weight:700;color:var(--black);text-decoration:none;letter-spacing:.08em;}
    .nav-logo span{color:var(--teal);}
    header.lh{padding:9rem 3.5rem 2.2rem;background:var(--cream);}
    .inner{max-width:900px;margin:0 auto;}
    .label{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:1rem;}
    h1{font-family:'Cormorant SC',serif;font-size:clamp(2rem,5vw,3.4rem);font-weight:600;line-height:1.1;color:var(--black);}
    .sub{font-family:'Cormorant',serif;font-style:italic;font-size:1.15rem;color:var(--muted);margin-top:.4rem;}
    main{padding:2.6rem 3.5rem 5rem;}
    .aviso{font-size:.78rem;color:var(--muted);font-style:italic;line-height:1.6;margin-bottom:2rem;}
    .dec{border:1px solid var(--border);border-radius:4px;margin-bottom:1.1rem;overflow:hidden;}
    .dec-cab{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.9rem 1.2rem;background:var(--cream);border-bottom:1px solid var(--border);}
    .dec-cab .rot{font-family:'Cormorant SC',serif;font-size:1.45rem;font-weight:700;color:var(--black);text-decoration:none;}
    .dec-cab .rot:hover{color:var(--teal-dark);}
    .dec-cab .n{font-size:.76rem;color:var(--muted);}
    .barra{height:4px;background:var(--teal);border-radius:3px;margin-top:.35rem;min-width:4px;}
    .anios{display:flex;flex-wrap:wrap;gap:.45rem;padding:1rem 1.2rem;}
    .anios a{display:inline-flex;align-items:baseline;gap:.35rem;border:1px solid var(--border);border-radius:20px;padding:.3rem .75rem;text-decoration:none;color:var(--text);font-size:.84rem;transition:all .15s;}
    .anios a:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);}
    .anios a b{font-family:'Cormorant SC',serif;font-weight:700;}
    .anios a span{font-size:.7rem;color:var(--muted);}
    .anios a:hover span{color:var(--teal-dark);}
    .ctx{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--teal);color:var(--teal-dark);border-radius:20px;padding:.2rem .7rem;text-decoration:none;}
    .ctx:hover{background:var(--teal-dark);color:#fff;}
    .ctx.off{border-color:var(--border);color:#aaa;}
    footer{background:#080808;padding:2.4rem 3.5rem;}
    .footer-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.2rem;}
    .footer-logo{font-family:'Cormorant SC',serif;font-size:1.4rem;font-weight:700;color:rgba(255,255,255,.6);}
    .footer-logo span{color:var(--teal);}
    .footer-copy{font-size:.72rem;color:rgba(255,255,255,.2);max-width:520px;line-height:1.6;}
    @media(max-width:860px){nav,header.lh,main,footer{padding-left:1.4rem;padding-right:1.4rem;}header.lh{padding-top:7rem;}}

    .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center;}
    .nav-links a{font-size:.78rem;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;opacity:.65;transition:opacity .2s,color .2s;}
    .nav-links a:hover{opacity:1;color:var(--teal);}
    .nav-links a.active{opacity:1;color:var(--teal);}
    .nav-links a.active:not(.nav-cta)::after{content:'';display:block;height:2px;background:var(--teal);margin-top:3px;border-radius:2px;}
    .nav-cta{background:var(--teal)!important;color:#fff!important;opacity:1!important;padding:.5rem 1.3rem;border-radius:2px;}
    .nav-cta:hover{background:var(--teal-dark)!important;}
    .nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
    .nav-hamburger span{display:block;width:24px;height:1.5px;background:var(--text);}
    @media(max-width:960px){.nav-links{display:none;}.nav-hamburger{display:flex;}.nav-links.open{display:flex;flex-direction:column;position:fixed;inset:0;top:58px;background:var(--cream);padding:2.2rem 1.6rem;gap:1.3rem;align-items:flex-start;z-index:99;overflow-y:auto;}.nav-links.open a{opacity:1;font-size:.95rem;}}
  
    /* ─── MENÚ DESPLEGABLE DE LA ZARZUTECA (30-8-2026) ─── */
    .zz-drop{position:relative;}
    .zz-drop-t{cursor:pointer;}
    .zz-car{display:inline-block;margin-left:.35em;font-size:.8em;line-height:1;transition:transform .18s;}
    .zz-drop.open .zz-car{transform:rotate(180deg);}
    .zz-drop-m{display:none;list-style:none;position:absolute;top:calc(100% + .95rem);left:50%;
      transform:translateX(-50%);min-width:12.5rem;background:#F8F4EE;border:1px solid #E2DAD0;
      border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.12);padding:.35rem 0;z-index:120;}
    .zz-drop.open>.zz-drop-m{display:block;}
    .zz-drop-m li{display:block;}
    .zz-drop-m a{display:block;padding:.6rem 1.15rem;font-size:.72rem;letter-spacing:.12em;
      text-transform:uppercase;white-space:nowrap;opacity:.75;}
    .zz-drop-m a:hover{opacity:1;color:#2AABB8;background:rgba(42,171,184,.09);}
    .zz-drop-m a::after{display:none!important;}
    @media(max-width:960px){
      .zz-drop{width:100%;}
      .zz-drop-m{position:static;transform:none;min-width:0;border:none;background:transparent;
        box-shadow:none;padding:.55rem 0 0 1rem;border-left:2px solid #E2DAD0;margin-top:.5rem;}
      .zz-drop-m a{padding:.45rem 0;font-size:.8rem;}
    }
</style>
</head>
<body>
<nav id="navbar">
  <a href="index.html#inicio" class="nav-logo">INNA<span>Z</span></a>
  <ul class="nav-links" id="navlinks">
    <li><a href="index.html#innaz">Qué es INNAZ</a></li>
    <li><a href="index.html#pilares">Pilares</a></li>
    <li><a href="index.html#sello">Sello de Calidad</a></li>
    <li class="zz-drop"><a href="index.html#biblioteca" class="zz-drop-t active" aria-haspopup="true" aria-expanded="false">Zarzuteca<span class="zz-car">▾</span></a><ul class="zz-drop-m"><li><a href="buscador.html">Obras</a></li><li><a href="autores.html">Autores</a></li><li><a href="teatros.html">Teatros</a></li><li><a href="anios.html">Años</a></li></ul></li>
    <li><a href="index.html#noticias">Noticias</a></li>
    <li><a href="index.html#contacto">Contacto</a></li>
    <li><a href="index.html#socio" class="nav-cta">Suscríbete</a></li>
  </ul>
  <button class="nav-hamburger" onclick="document.getElementById('navlinks').classList.toggle('open')" aria-label="Menú"><span></span><span></span><span></span></button>
</nav>
<header class="lh">
  <div class="inner">
    <p class="label">Zarzuteca INNAZ · Índice</p>
    <h1>Años</h1>
    <p class="sub" id="sub">…</p>
  </div>
</header>
<main><div class="inner">
  <p class="aviso" id="aviso"></p>
  <div id="body"></div>
</div></main>
<footer>
  <div class="footer-inner">
    <div class="footer-logo">INNA<span>Z</span></div>
    <p class="footer-copy">© 2026 Instituto Nacional de Zarzuela · Zarzuteca INNAZ</p>
  </div>
</footer>
<script>
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const OB=(typeof OBRAS!=='undefined')?OBRAS:[];
  const DE=(typeof DECADAS!=='undefined')?DECADAS:[];

  // Recuento de estrenos por año y por década, sobre las obras publicadas.
  const porAnio={}, porDec={};
  OB.forEach(o=>{
    const a=parseInt(o.anioN||'',10);
    if(!a) return;
    porAnio[a]=(porAnio[a]||0)+1;
    const d=Math.floor(a/10)*10;
    porDec[d]=(porDec[d]||0)+1;
  });

  // Si por lo que sea el .js no trajera DECADAS —una versión antigua del
  // archivo—, la página sigue funcionando construyéndolas de los años.
  const decs=(DE.length?DE.slice():Object.keys(porDec).map(d=>({d:+d,rot:d+'-'+(+d+9)})))
    .sort((a,b)=>a.d-b.d);

  const anios=Object.keys(porAnio).map(Number).sort((a,b)=>a-b);
  const conTexto=decs.filter(d=>d.pol||d.art||d.lir).length;
  const maxDec=Math.max(1,...decs.map(d=>porDec[d.d]||0));

  $('sub').textContent=OB.length+' estrenos entre '+(anios[0]||'')+' y '+(anios[anios.length-1]||'')+
    ' · '+anios.length+' años en '+decs.length+' décadas';
  $('aviso').textContent='El catálogo se recorre por décadas, y cada década tiene su propio análisis del '+
    'momento histórico: la política, las demás artes y el estado del teatro lírico. La ficha de un año '+
    'concreto lista sus estrenos y muestra el análisis de su década. Los recuentos son de obras con ficha '+
    'ya publicada, no del total estrenado en cada año. '+
    (conTexto?('Hay '+conTexto+' de '+decs.length+' análisis escritos.')
             :'Los análisis de década están pendientes de redactar: se escriben por tandas, con fuentes declaradas.');

  $('body').innerHTML=decs.map(d=>{
    const n=porDec[d.d]||0;
    const chips=[];
    for(let a=d.d;a<=d.d+9;a++){
      if(!porAnio[a]) continue;
      chips.push('<a href="listado.html?tipo=anio&v='+a+'"><b>'+a+'</b><span>'+porAnio[a]+'</span></a>');
    }
    const tieneTexto=!!(d.pol||d.art||d.lir);
    const enlaceCtx=tieneTexto
      ? '<a class="ctx" href="listado.html?tipo=decada&v='+d.d+'">Ver el análisis</a>'
      : '<a class="ctx off" href="listado.html?tipo=decada&v='+d.d+'">Análisis pendiente</a>';
    return '<div class="dec">'+
      '<div class="dec-cab">'+
        '<div><a class="rot" href="listado.html?tipo=decada&v='+d.d+'">'+esc(d.rot||(d.d+'-'+(d.d+9)))+'</a>'+
        '<div class="barra" style="width:'+Math.round(100*n/maxDec)+'%"></div></div>'+
        '<div style="display:flex;align-items:center;gap:.7rem;">'+
          '<span class="n">'+n+(n===1?' estreno':' estrenos')+'</span>'+enlaceCtx+
        '</div>'+
      '</div>'+
      (chips.length?'<div class="anios">'+chips.join('')+'</div>':'')+
    '</div>';
  }).join('');
</script>

<script>
/* Menú desplegable de la Zarzuteca (30-8-2026). Se abre al hacer clic, no al
   pasar por encima: en táctil el hover no existe. Se cierra al pulsar fuera,
   con Escape, y al elegir una opción (llamando a closeMenu() si la página lo
   define, que es el caso de index.html). */
(function(){
  var d=document.querySelector('.zz-drop'); if(!d) return;
  var t=d.querySelector('.zz-drop-t');
  function cerrar(){ d.classList.remove('open'); if(t) t.setAttribute('aria-expanded','false'); }
  if(t) t.addEventListener('click',function(e){
    e.preventDefault();
    var abierto=d.classList.toggle('open');
    t.setAttribute('aria-expanded',abierto?'true':'false');
  });
  document.addEventListener('click',function(e){ if(!d.contains(e.target)) cerrar(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') cerrar(); });
  d.querySelectorAll('.zz-drop-m a').forEach(function(a){
    a.addEventListener('click',function(){
      cerrar();
      if(typeof closeMenu==='function'){ closeMenu(); return; }
      var nl=document.getElementById('navlinks'); if(nl) nl.classList.remove('open');
    });
  });
})();
</script>
</body>
</html>
